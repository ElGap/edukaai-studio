[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edukaai-studio"
version = "0.1.0"
description = "Local LLM fine-tuning studio for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ElGap", email = "hello@elgap.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core Framework
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.18",
    "websockets>=12.0",
    # Database
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    # MLX & ML
    "mlx>=0.23.0",
    "mlx-lm>=0.31.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.0",
    # Data & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Development (optional — included for test block)
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/elgap/edukaai-studio"
Repository = "https://github.com/elgap/edukaai-studio"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/*.py", "ml/*.py", "routers/*.py"]

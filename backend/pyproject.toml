[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edukaai-studio"
version = "0.1.1"
description = "Local LLM fine-tuning studio for Apple Silicon"
readme = "../README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ElGap", email = "hello@elgap.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/elgap/edukaai-studio"
Repository = "https://github.com/elgap/edukaai-studio"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/*.py", "ml/*.py", "routers/*.py"]
